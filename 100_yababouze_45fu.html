<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>４五歩早仕掛け 基本部分図 — やばボーズ流</title>
<style>
:root {
  --bg: #0b0f1a;
  --bg-2: #11172a;
  --surface: #161c2e;
  --surface-hi: #1d2540;
  --border: rgba(255, 255, 255, 0.08);
  --border-hi: rgba(255, 255, 255, 0.16);
  --text: #e7ecf6;
  --text-dim: #9aa3b8;
  --text-muted: #6b7390;
  --pink: #ff3d8a;
  --pink-soft: #ff7eb3;
  --cyan: #22e2ff;
  --purple: #a855f7;
  --amber: #ffb84d;
  --gradient-hero: linear-gradient(135deg, #ff3d8a 0%, #a855f7 50%, #22e2ff 100%);
  --gradient-line: linear-gradient(90deg, #ff3d8a, #a855f7 60%, #22e2ff);
  --tree-line: rgba(34, 226, 255, 0.55);
  --tree-line-soft: rgba(34, 226, 255, 0.28);
  --tree-line-pink: rgba(255, 61, 138, 0.7);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: "Inter", "SF Pro Display", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  background:
    radial-gradient(1200px 600px at 10% -10%, rgba(168, 85, 247, 0.18), transparent 60%),
    radial-gradient(1000px 500px at 110% 10%, rgba(34, 226, 255, 0.12), transparent 55%),
    radial-gradient(900px 600px at 50% 110%, rgba(255, 61, 138, 0.12), transparent 60%),
    var(--bg);
  background-attachment: fixed;
  color: var(--text);
  line-height: 1.7;
  letter-spacing: 0.01em;
}

#topbar {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 22px;
  background: rgba(11, 15, 26, 0.7);
  backdrop-filter: blur(14px) saturate(140%);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
  position: sticky; top: 0; z-index: 10;
}
#topbar::after {
  content: ""; position: absolute;
  left: 0; right: 0; bottom: -1px; height: 1px;
  background: var(--gradient-line); opacity: 0.6;
}
#topbar h1 {
  margin: 0; font-size: 18px; font-weight: 800;
  letter-spacing: 0.02em; white-space: nowrap;
  background: var(--gradient-hero);
  -webkit-background-clip: text; background-clip: text;
  color: transparent;
}

#edit-toolbar {
  display: flex; align-items: center; gap: 8px;
  margin-left: auto; flex-wrap: wrap; font-size: 12px;
}
.toggle-label {
  display: flex; align-items: center; gap: 6px;
  cursor: pointer; user-select: none;
  color: var(--text-dim); padding: 4px 10px;
  border: 1px solid var(--border); border-radius: 999px;
}
.toggle-label:has(input:checked) {
  color: var(--text); border-color: var(--pink);
  background: rgba(255, 61, 138, 0.08);
}
#edit-toolbar input[type="checkbox"] { accent-color: var(--pink); }
#edit-toolbar button, #edit-toolbar .import-label {
  background: rgba(255, 255, 255, 0.04);
  color: var(--text-dim);
  border: 1px solid var(--border); border-radius: 999px;
  padding: 5px 12px; font-size: 12px; cursor: pointer;
  font-family: inherit; transition: all 0.18s ease;
}
#edit-toolbar button:hover:not(:disabled),
#edit-toolbar .import-label:hover {
  border-color: var(--border-hi); color: var(--text);
  background: rgba(255, 255, 255, 0.07);
}
#edit-toolbar button.primary {
  background: var(--gradient-hero); color: #0b0f1a;
  border: 0; font-weight: 700; padding: 6px 14px;
  box-shadow: 0 4px 18px rgba(255, 61, 138, 0.3);
}
#edit-toolbar button.primary:hover:not(:disabled) {
  filter: brightness(1.1);
  box-shadow: 0 6px 24px rgba(255, 61, 138, 0.45);
}
#edit-toolbar button:disabled { opacity: 0.35; cursor: not-allowed; }
#status-msg { font-size: 11px; color: var(--cyan); min-width: 80px; }

main {
  max-width: 920px; margin: 0 auto;
  padding: 28px 20px 80px;
  display: flex; flex-direction: column; gap: 22px;
}
section {
  position: relative;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.025), rgba(255, 255, 255, 0.005)), var(--surface);
  border: 1px solid var(--border); border-radius: 14px;
  padding: 22px 26px;
  box-shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 12px 30px -16px rgba(0, 0, 0, 0.5);
  transition: border-color 0.2s ease, transform 0.2s ease;
}
section:hover { border-color: var(--border-hi); }
section h2 {
  margin: 0 0 14px; font-size: 18px; font-weight: 700;
  color: var(--text); letter-spacing: 0.02em;
  display: flex; align-items: center; gap: 12px;
}
section h2::before {
  content: ""; width: 4px; height: 18px; border-radius: 2px;
  background: var(--gradient-hero); flex-shrink: 0;
}

section.catch {
  background:
    radial-gradient(800px 200px at 50% 0%, rgba(255, 61, 138, 0.18), transparent 60%),
    var(--surface);
  border: 1px solid var(--border);
  text-align: center; padding: 42px 22px 38px;
}
section.catch [data-editable-key="catch"] {
  font-size: 28px; font-weight: 800; letter-spacing: 0.02em;
  background: var(--gradient-hero);
  -webkit-background-clip: text; background-clip: text;
  color: transparent; line-height: 1.4;
}
section.catch .catch-placeholder {
  margin: 0; background: none;
  -webkit-text-fill-color: var(--text-muted);
  color: var(--text-muted);
  font-style: italic; font-weight: 500; font-size: 22px;
}

section.winning-image .board-and-caption {
  display: grid; grid-template-columns: auto 1fr;
  gap: 26px; align-items: center;
}
@media (max-width: 720px) {
  section.winning-image .board-and-caption {
    grid-template-columns: 1fr; justify-items: center;
  }
}
.caption { font-size: 15px; color: var(--text-dim); line-height: 1.8; }

#hand-board-stack {
  display: flex; flex-direction: column;
  background: linear-gradient(180deg, #2a3148, #1c2238);
  border: 1px solid var(--border-hi); border-radius: 10px;
  padding: 8px; width: max-content;
  box-shadow: 0 18px 44px -16px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(168, 85, 247, 0.1) inset;
}
#hand-board-stack.flipped { flex-direction: column-reverse; }
.hand-row {
  min-height: 28px; padding: 3px 6px;
  display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
}
.hand-piece {
  display: inline-block;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 6px; padding: 2px 7px;
  font-size: 13px; font-weight: 700; color: var(--text);
}
.hand-piece.rotated { transform: rotate(180deg); }
.hand-empty { color: var(--text-muted); font-size: 10px; }

#board-container { display: flex; flex-direction: column; gap: 3px; }
.coord-row { display: flex; justify-content: space-around; padding: 0 2px; font-size: 10px; color: var(--text-muted); }
.coord-col { display: flex; flex-direction: column; justify-content: space-around; padding: 2px 0; font-size: 10px; color: var(--text-muted); }
#board-row { display: flex; align-items: stretch; gap: 2px; }
#board-with-overlay { position: relative; }
#board {
  border-collapse: collapse;
  background: linear-gradient(180deg, #f0d8a0, #e6c98a);
  border: 1px solid #2b1f1a; border-radius: 4px; overflow: hidden;
}
#board td {
  width: 30px; height: 32px;
  border: 1px solid rgba(43, 31, 26, 0.45);
  text-align: center; vertical-align: middle;
  position: relative; padding: 0;
}
.piece-glyph {
  font-size: 19px; font-weight: 800; color: #1a1310;
  line-height: 1; display: inline-block;
}
#board td.promoted .piece-glyph { color: #b54040; }
#board td.last-to {
  background: linear-gradient(135deg, #ff3d8a, #a855f7);
  box-shadow: inset 0 0 0 2px #ff3d8a, 0 0 14px rgba(255, 61, 138, 0.6);
}
#board td.last-to .piece-glyph {
  color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
}

section ul { margin: 6px 0 0; padding-left: 22px; list-style: none; }
section ul li {
  position: relative; margin-bottom: 8px; padding-left: 18px;
  color: var(--text-dim);
}
section ul li::before {
  content: ""; position: absolute;
  left: 0; top: 0.7em; width: 6px; height: 6px;
  border-radius: 50%; background: var(--gradient-hero);
}
section p { margin: 6px 0; color: var(--text-dim); }
section strong {
  color: var(--text);
  background: linear-gradient(transparent 60%, rgba(255, 61, 138, 0.25) 60%);
  padding: 0 2px; font-weight: 700;
}

.cls-tree { padding: 4px 0; }
.cls-tree + .cls-tree { margin-top: 28px; }
.cls-branch { position: relative; }
.cls-pill {
  position: relative; display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 18px; border-radius: 999px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--border); color: var(--text);
  font-size: 14px; font-weight: 700; letter-spacing: 0.03em;
  z-index: 1;
}
.cls-pill::before {
  content: ""; width: 7px; height: 7px; border-radius: 50%;
  background: var(--cyan); box-shadow: 0 0 8px rgba(34, 226, 255, 0.55);
  flex-shrink: 0;
}
.cls-pill-root {
  font-size: 15px;
  background: rgba(168, 85, 247, 0.10);
  border-color: rgba(168, 85, 247, 0.5);
}
.cls-pill-root::before {
  background: var(--purple); box-shadow: 0 0 8px rgba(168, 85, 247, 0.55);
}
.cls-pill.cls-current {
  background: linear-gradient(135deg, rgba(255, 61, 138, 0.24), rgba(168, 85, 247, 0.24));
  border-color: var(--pink); color: var(--text);
  box-shadow: 0 0 0 1px rgba(255, 61, 138, 0.25), 0 8px 24px -10px rgba(255, 61, 138, 0.55);
  font-size: 16px;
}
.cls-pill.cls-current::before {
  background: var(--pink); box-shadow: 0 0 10px rgba(255, 61, 138, 0.7);
}

.cls-children { position: relative; margin-top: 16px; padding-left: 36px; }
.cls-children > .cls-branch + .cls-branch { margin-top: 22px; }
.cls-children > .cls-branch::before {
  content: ""; position: absolute;
  left: -24px; top: -22px; width: 24px; height: 42px;
  border-left: 2px solid var(--tree-line);
  border-bottom: 2px solid var(--tree-line);
  border-bottom-left-radius: 8px;
}
.cls-children > .cls-branch:first-child::before { top: -16px; height: 36px; }
.cls-children > .cls-branch:not(:last-child)::after {
  content: ""; position: absolute;
  left: -24px; top: 20px; bottom: -22px; width: 0;
  border-left: 2px solid var(--tree-line);
}

.sankei-tree .sankei-leaf > .cls-pill {
  font-size: 15px;
  background: rgba(255, 255, 255, 0.06);
  border-color: rgba(255, 255, 255, 0.18);
}
.sankei-tree .sankei-leaf > .cls-pill::before {
  background: var(--pink-soft); box-shadow: 0 0 8px rgba(255, 126, 179, 0.5);
}
.sankei-tree .sankei-leaf::before { border-color: rgba(255, 126, 179, 0.5) !important; }
.sankei-tree .sankei-leaf:not(:last-child)::after { border-color: rgba(255, 126, 179, 0.5) !important; }
.sankei-tree .sankei-leaf.var-main > .cls-pill {
  background: linear-gradient(135deg, rgba(255, 61, 138, 0.18), rgba(168, 85, 247, 0.18));
  border-color: rgba(255, 61, 138, 0.5);
}
.sankei-tree .sankei-leaf.var-main > .cls-pill::before {
  background: var(--pink); box-shadow: 0 0 10px rgba(255, 61, 138, 0.7);
}
.sankei-tree .sankei-leaf.var-main > .cls-pill::after {
  content: "主要"; color: #0b0f1a;
  background: var(--gradient-hero);
  font-size: 10px; font-weight: 800; letter-spacing: 0.08em;
  padding: 2px 8px; border-radius: 999px; margin-left: 4px;
}
.sankei-body {
  margin-top: 10px; margin-left: 6px;
  padding: 14px 16px;
  background: rgba(255, 255, 255, 0.025);
  border: 1px solid var(--border); border-radius: 10px;
  display: grid; grid-template-columns: auto 1fr;
  gap: 18px; align-items: start;
}
.sankei-body:not(:has(.mini-board-stack)) { grid-template-columns: 1fr; }
@media (max-width: 720px) { .sankei-body { grid-template-columns: 1fr; } }

/* === per-variation interactive viewer === */
.sankei-body.var-body {
  display: flex; flex-direction: column; gap: 12px;
}
.var-intro { margin: 0; font-size: 14px; color: var(--text-dim); line-height: 1.7; }
.var-intro:empty { display: none; }
.var-stage {
  display: grid; grid-template-columns: auto minmax(0, 260px);
  gap: 16px; align-items: start;
}
@media (max-width: 720px) {
  .var-stage { grid-template-columns: 1fr; justify-items: center; }
}
.var-board-wrap {
  display: flex; flex-direction: column; gap: 8px; align-items: center;
}
.var-board-wrap .mini-board-stack table.mini-board td {
  width: 28px; height: 30px;
}
.var-board-wrap .mini-board-stack table.mini-board .piece-glyph {
  font-size: 17px;
}
.var-board-wrap .mini-board-stack .mini-hand-piece {
  font-size: 12px; padding: 2px 6px; border-radius: 5px;
}
.var-board-wrap .mini-board-stack .mini-hand {
  min-height: 26px; padding: 3px 5px; gap: 4px;
}
.var-controls {
  display: flex; align-items: center; gap: 6px; font-size: 12px;
}
.var-controls button {
  background: rgba(255,255,255,0.04);
  color: var(--text);
  border: 1px solid var(--border); border-radius: 999px;
  padding: 3px 9px; font-size: 12px; cursor: pointer;
  font-family: inherit; transition: all 0.18s ease;
  min-width: 28px;
}
.var-controls button:hover:not(:disabled) {
  border-color: var(--pink); color: var(--text);
  background: rgba(255,61,138,0.08);
}
.var-controls button:disabled { opacity: 0.3; cursor: not-allowed; }
.var-ply-indicator {
  min-width: 78px; text-align: center;
  font-size: 11px; font-weight: 700; letter-spacing: 0.04em;
  color: var(--text-dim);
  padding: 3px 8px; border-radius: 999px;
  background: rgba(168,85,247,0.10);
  border: 1px solid rgba(168,85,247,0.3);
}
@media (min-width: 721px) {
  .var-stage > .var-list {
    overflow-y: auto;
    padding-right: 4px;
    scroll-behavior: smooth;
  }
  .var-stage > .var-list::-webkit-scrollbar { width: 6px; }
  .var-stage > .var-list::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.12); border-radius: 999px;
  }
}
/* muted (pre-divergence main) rows in variation lists */
.move-row.muted {
  opacity: 0.55;
  background: transparent;
  border-style: dashed;
}
.move-row.muted .move-pill { font-weight: 500; filter: saturate(0.5); }
.move-row.muted .move-comment { display: none; }
.var-stage .move-row { cursor: pointer; }
.var-stage .move-row:hover {
  background: rgba(255,255,255,0.05);
  border-color: var(--border-hi);
  opacity: 1;
}
.var-stage .move-row.active {
  background: linear-gradient(90deg, rgba(255,61,138,0.18), rgba(168,85,247,0.10));
  border-color: var(--pink);
  border-left-color: var(--pink);
  border-style: solid;
  opacity: 1;
  box-shadow: 0 0 0 1px rgba(255,61,138,0.25), 0 6px 18px -10px rgba(255,61,138,0.45);
}
.sankei-caption { font-size: 14px; color: var(--text-dim); line-height: 1.7; }
.sankei-caption .var-intro { margin: 0 0 8px; color: var(--text-dim); }
.sankei-caption .var-intro:empty { display: none; }

.mini-board-stack {
  display: flex; flex-direction: column;
  background: linear-gradient(180deg, #2a3148, #1c2238);
  border: 1px solid var(--border-hi); border-radius: 8px;
  padding: 6px; width: max-content;
  box-shadow: 0 10px 28px -16px rgba(0, 0, 0, 0.6);
}
.mini-board-stack.flipped { flex-direction: column-reverse; }
.mini-board-stack .mini-hand {
  min-height: 22px; padding: 2px 4px;
  display: flex; flex-wrap: wrap; gap: 3px; align-items: center;
}
.mini-board-stack .mini-hand-piece {
  display: inline-block;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 4px; padding: 1px 5px;
  font-size: 11px; font-weight: 700; color: var(--text);
}
.mini-board-stack .mini-hand-piece.rotated { transform: rotate(180deg); }
.mini-board-stack .mini-hand-empty { color: var(--text-muted); font-size: 9px; }
.mini-board-stack table.mini-board {
  border-collapse: collapse;
  background: linear-gradient(180deg, #f0d8a0, #e6c98a);
  border: 1px solid #2b1f1a; border-radius: 3px;
  overflow: hidden; margin: 2px 0;
}
.mini-board-stack table.mini-board td {
  width: 22px; height: 24px;
  border: 1px solid rgba(43, 31, 26, 0.45);
  text-align: center; vertical-align: middle;
  position: relative; padding: 0;
}
.mini-board-stack table.mini-board .piece-glyph {
  font-size: 14px; font-weight: 800; color: #1a1310;
  line-height: 1; display: inline-block;
}
.mini-board-stack table.mini-board td.promoted .piece-glyph { color: #b54040; }
.mini-board-stack table.mini-board td.last-to {
  background: linear-gradient(135deg, #ff3d8a, #a855f7);
  box-shadow: inset 0 0 0 2px #ff3d8a, 0 0 10px rgba(255, 61, 138, 0.6);
}
.mini-board-stack table.mini-board td.last-to .piece-glyph {
  color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
}

/* === practical game viewer === */
.practical-games .game-picker-wrap {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 18px; flex-wrap: wrap;
}
.practical-games .game-picker-wrap label {
  font-size: 13px; color: var(--text-dim); font-weight: 600;
  letter-spacing: 0.02em;
}
.practical-games #game-picker {
  background: rgba(255, 255, 255, 0.04);
  color: var(--text);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 6px 28px 6px 12px; font-size: 13px;
  font-family: inherit; cursor: pointer;
  min-width: 320px; max-width: 100%;
  transition: border-color 0.18s ease, background 0.18s ease;
  appearance: none; -webkit-appearance: none;
  background-image:
    linear-gradient(45deg, transparent 50%, var(--text-dim) 50%),
    linear-gradient(135deg, var(--text-dim) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 9px) 50%;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
}
.practical-games #game-picker:hover,
.practical-games #game-picker:focus {
  border-color: var(--pink);
  background-color: rgba(255, 61, 138, 0.06);
  outline: none;
}
.practical-games #game-picker option {
  background: var(--surface); color: var(--text);
}
.practical-games .game-counter {
  font-size: 11px; color: var(--text-muted);
  letter-spacing: 0.04em; margin-left: auto;
}
.practical-games .game-block + .game-block { margin-top: 28px; }
.practical-games .game-title {
  font-size: 16px; font-weight: 700; letter-spacing: 0.02em;
  margin: 0 0 6px;
  color: var(--text);
  background: var(--gradient-hero);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.practical-games .game-meta {
  margin: 0 0 12px;
  font-size: 13px; color: var(--text-dim); line-height: 1.7;
}
.practical-games .game-stage {
  display: grid; grid-template-columns: auto 1fr;
  gap: 22px; align-items: start;
}
@media (max-width: 720px) {
  .practical-games .game-stage { grid-template-columns: 1fr; justify-items: center; }
}
.practical-games .game-board-wrap {
  display: flex; flex-direction: column; gap: 10px; align-items: center;
}
.practical-games .game-board-wrap .mini-board-stack table.mini-board td {
  width: 28px; height: 30px;
}
.practical-games .game-board-wrap .mini-board-stack table.mini-board .piece-glyph {
  font-size: 17px;
}
.practical-games .game-board-wrap .mini-board-stack .mini-hand-piece {
  font-size: 12px; padding: 2px 6px; border-radius: 5px;
}
.practical-games .game-board-wrap .mini-board-stack .mini-hand {
  min-height: 26px; padding: 3px 5px; gap: 4px;
}
.practical-games .game-controls {
  display: flex; align-items: center; gap: 6px; font-size: 12px;
}
.practical-games .game-controls button {
  background: rgba(255,255,255,0.04);
  color: var(--text);
  border: 1px solid var(--border); border-radius: 999px;
  padding: 4px 10px; font-size: 13px; cursor: pointer;
  font-family: inherit; transition: all 0.18s ease;
  min-width: 30px;
}
.practical-games .game-controls button:hover:not(:disabled) {
  border-color: var(--pink); color: var(--text);
  background: rgba(255,61,138,0.08);
}
.practical-games .game-controls button:disabled { opacity: 0.3; cursor: not-allowed; }
.practical-games .game-ply-indicator {
  min-width: 88px; text-align: center;
  font-size: 11px; font-weight: 700; letter-spacing: 0.04em;
  color: var(--text-dim);
  padding: 4px 9px; border-radius: 999px;
  background: rgba(168,85,247,0.10);
  border: 1px solid rgba(168,85,247,0.3);
}
@media (min-width: 721px) {
  .practical-games .game-list {
    overflow-y: auto;
    padding-right: 4px;
    scroll-behavior: smooth;
  }
  .practical-games .game-list::-webkit-scrollbar { width: 6px; }
  .practical-games .game-list::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.12); border-radius: 999px;
  }
}
.practical-games .move-row { cursor: pointer; }
.practical-games .move-row:hover {
  background: rgba(255,255,255,0.05);
  border-color: var(--border-hi);
}
.practical-games .move-row.active {
  background: linear-gradient(90deg, rgba(255,61,138,0.18), rgba(168,85,247,0.10));
  border-color: var(--pink);
  border-left-color: var(--pink);
  box-shadow: 0 0 0 1px rgba(255,61,138,0.25), 0 6px 18px -10px rgba(255,61,138,0.45);
}

/* === interactive main-line board === */
.mainline-hint {
  margin: -4px 0 14px; font-size: 12px;
  color: var(--text-muted); letter-spacing: 0.02em;
}
.mainline-stage {
  display: grid; grid-template-columns: auto 1fr;
  gap: 22px; align-items: start;
}
@media (max-width: 720px) {
  .mainline-stage { grid-template-columns: 1fr; justify-items: center; }
}
@media (min-width: 721px) {
  .movelist #main-line-list {
    overflow-y: auto;
    /* max-height は JS で .mainline-board-wrap の高さに同期 */
    padding-right: 4px;
    scroll-behavior: smooth;
  }
  /* 細いスクロールバー */
  .movelist #main-line-list::-webkit-scrollbar { width: 6px; }
  .movelist #main-line-list::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.12); border-radius: 999px;
  }
}
.mainline-board-wrap {
  display: flex; flex-direction: column; gap: 10px;
  align-items: center;
}
/* enlarge mini board specifically inside mainline */
.mainline-board-wrap .mini-board-stack table.mini-board td {
  width: 30px; height: 32px;
}
.mainline-board-wrap .mini-board-stack table.mini-board .piece-glyph {
  font-size: 19px;
}
.mainline-board-wrap .mini-board-stack .mini-hand-piece {
  font-size: 13px; padding: 2px 7px; border-radius: 6px;
}
.mainline-board-wrap .mini-board-stack .mini-hand {
  min-height: 28px; padding: 3px 6px; gap: 4px;
}
.mainline-controls {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px;
}
.mainline-controls button {
  background: rgba(255,255,255,0.04);
  color: var(--text);
  border: 1px solid var(--border); border-radius: 999px;
  padding: 4px 12px; font-size: 14px; cursor: pointer;
  font-family: inherit; transition: all 0.18s ease;
  min-width: 32px;
}
.mainline-controls button:hover:not(:disabled) {
  border-color: var(--pink); color: var(--text);
  background: rgba(255,61,138,0.08);
  box-shadow: 0 0 12px rgba(255,61,138,0.25);
}
.mainline-controls button:disabled { opacity: 0.3; cursor: not-allowed; }
.ml-ply-indicator {
  min-width: 92px; text-align: center;
  font-size: 12px; font-weight: 700; letter-spacing: 0.04em;
  color: var(--text-dim);
  padding: 4px 10px; border-radius: 999px;
  background: rgba(168,85,247,0.10);
  border: 1px solid rgba(168,85,247,0.3);
}

/* === move list (本筋・変化手順) === */
.move-list {
  list-style: none; margin: 6px 0 0; padding: 0;
  display: flex; flex-direction: column; gap: 8px;
  position: relative; /* offsetTop の基準を自分にする */
}
.move-row {
  display: grid; grid-template-columns: auto auto 1fr;
  gap: 12px; align-items: center;
  padding: 6px 10px;
  background: rgba(255, 255, 255, 0.025);
  border: 1px solid var(--border);
  border-left: 2px solid var(--tree-line-soft);
  border-radius: 8px;
  transition: background 0.15s ease, border-color 0.15s ease;
}
.movelist .move-row { cursor: pointer; }
.movelist .move-row:hover {
  background: rgba(255, 255, 255, 0.05);
  border-color: var(--border-hi);
}
.movelist .move-row.active {
  background: linear-gradient(90deg, rgba(255,61,138,0.18), rgba(168,85,247,0.10));
  border-color: var(--pink);
  border-left-color: var(--pink);
  box-shadow: 0 0 0 1px rgba(255,61,138,0.25), 0 6px 18px -10px rgba(255,61,138,0.45);
}
.move-num {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 28px; height: 22px; padding: 0 7px;
  font-size: 11px; font-weight: 800;
  color: var(--text-muted);
  border: 1px solid var(--border); border-radius: 999px;
  background: rgba(255, 255, 255, 0.03);
}
.move-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 12px; border-radius: 999px;
  font-size: 14px; font-weight: 700; letter-spacing: 0.04em;
  border: 1px solid var(--border);
  white-space: nowrap;
}
.move-pill.gote {
  color: var(--pink-soft);
  background: rgba(255, 61, 138, 0.08);
  border-color: rgba(255, 61, 138, 0.35);
}
.move-pill.sente {
  color: var(--cyan);
  background: rgba(34, 226, 255, 0.08);
  border-color: rgba(34, 226, 255, 0.35);
}
.move-comment {
  font-size: 13px; color: var(--text-dim); line-height: 1.6;
}
.move-comment:empty::before {
  content: "（コメントなし）";
  color: var(--text-muted); font-style: italic; opacity: 0.5;
}
.move-list-mini { gap: 4px; margin-top: 8px; }
.move-list-mini .move-row {
  padding: 4px 8px;
  background: transparent;
  border: 0; border-left: 1px dashed var(--border-hi);
  border-radius: 0;
}
.move-list-mini .move-pill { font-size: 12px; padding: 2px 9px; }
.move-list-mini .move-num  { min-width: 22px; height: 18px; font-size: 10px; padding: 0 6px; }
.move-list-mini .move-comment { font-size: 12px; }
@media (max-width: 600px) {
  .move-row { grid-template-columns: auto auto; }
  .move-comment { grid-column: 1 / -1; }
}

body.edit-mode [data-editable-key] {

    "var_a_intro": "<p>その場で思いついたような、苦し紛れの飛車回りには ―</p>",

    "var_a_move_5_comment": "",
    "var_a_move_6_comment": "",
    "var_a_move_7_comment": "",
    "var_a_move_8_comment": "",
    "var_a_move_9_comment": "<p>先手番に手渡しする展開になるが、<br>先手側が <strong>３三・２七</strong> に角を打つスペースがあり、収集が難しい</p>",
    "var_a_move_10_comment": "<p>無理やり受けても</p>",
    "var_a_move_11_comment": "<p>４五歩とあわされて、先手が収集ついていない</p>",
    "var_b_intro": "<p>▲４六銀 とぶつけてくる変化。</p>",
    "var_b_move_4_comment": "",
    "var_b_move_5_comment": "数で勝っているので普通に攻める",
    "var_b_move_6_comment": "",
    "var_b_move_7_comment": "飛車を躱して優勢、４一飛と逃げる場合は、たたきの歩に注意",
    "var_c_intro": "<p>４手目に角を打って受けてくる変化。</p>",
    "var_c_move_4_comment": "",
    "var_c_move_5_comment": "<p>これで受かっている</p>",
    "var_d_intro": "<p>２手目で同歩と取らず、銀を出てくる変化。</p>",
    "var_d_move_2_comment": "",
    "var_d_move_3_comment": "",
    "var_d_move_4_comment": "",
    "var_d_move_5_comment": "普通に押し込んで優勢、<br>△８三角の対応が難しい",
    "var_e_intro": "<p>２手目で同歩と取らず、いきなり ▲４八飛 と回る変化。</p>",
    "var_e_move_2_comment": "",
    "var_e_move_3_comment": "",
    "var_e_move_4_comment": "",
    "var_e_move_5_comment": "",
    "var_e_move_6_comment": "",
    "var_e_move_7_comment": "",
    "var_e_move_8_comment": "",
    "var_e_move_9_comment": "<p>結局 △３三角 の受けが難しい</p>",
    "summary": "<ul><li>４五歩早仕掛けの本命形。先手 ▲３七桂・▲４七銀型であれば、すぐに&nbsp;<strong>△４五歩と仕掛けよう。</strong></li><li>先手▲２一角には<span style=\"color: rgb(231, 236, 246); background-image: linear-gradient(transparent 60%, rgba(255, 61, 138, 0.25) 60%); background-position: initial; background-size: initial; background-repeat: initial; background-attachment: initial; background-origin: initial; background-clip: initial; padding: 0px 2px; font-weight: 700; letter-spacing: 0.16px;\">△４一角</span><span style=\"letter-spacing: 0.16px;\">が定跡</span></li></ul>",

// ===== SFEN parser / piece glyph =====
const INITIAL_SFEN = "lnsgkgsnl/1r5b1/ppppppppp/9/9/9/PPPPPPPPP/1B5R1/LNSGKGSNL b - 1";
const NUM_KAN = ["", "一", "二", "三", "四", "五", "六", "七", "八", "九"];
const SFEN_LETTER_TO_KANJI = { P: "歩", L: "香", N: "桂", S: "銀", G: "金", B: "角", R: "飛", K: "玉" };
const PROMOTED_LETTER_TO_KANJI = { P: "と", L: "杏", N: "圭", S: "全", B: "馬", R: "龍" };
function parseSfen(sfen) {
  const parts = sfen.split(" ");
  const boardStr = parts[0]; const turn = parts[1]; const handStr = parts[2] || "-";
  const grid = [];
  for (const row of boardStr.split("/")) {
    const r = []; let i = 0;
    while (i < row.length) {
      const ch = row[i];
      if (/[1-9]/.test(ch)) { const n = parseInt(ch); for (let j=0;j<n;j++) r.push(null); i++; }
      else if (ch === "+") { const next = row[i+1]; r.push({ letter: next.toUpperCase(), color: next === next.toUpperCase() ? "sente":"gote", promoted: true }); i += 2; }
      else { r.push({ letter: ch.toUpperCase(), color: ch === ch.toUpperCase() ? "sente":"gote", promoted: false }); i++; }
    }
    grid.push(r);
  }
  const senteHand = {}, goteHand = {};
  if (handStr !== "-") {
    let i = 0;
    while (i < handStr.length) {
      let num = "";
      while (i < handStr.length && /\d/.test(handStr[i])) { num += handStr[i]; i++; }
      const count = num ? parseInt(num) : 1;
      const ch = handStr[i]; if (!ch) break;
      const target = ch === ch.toUpperCase() ? senteHand : goteHand;
      const key = ch.toUpperCase();
      target[key] = (target[key] || 0) + count;
      i++;
    }
  }
  return { grid, turn, senteHand, goteHand };
}
function pieceKanji(cell) {
  if (!cell) return "";
  const map = cell.promoted ? PROMOTED_LETTER_TO_KANJI : SFEN_LETTER_TO_KANJI;
  return map[cell.letter] || cell.letter;
}

// ===== large board =====
let FLIPPED = true;
function setFlipped(v) { FLIPPED = !!v; }
function cellIndexToFileRank(col, row) { let c=col, r=row; if (FLIPPED){c=8-c;r=8-r;} return { file: 9-c, rank: r+1 }; }
function renderBoard(sfen, lastMove) {
  const board = document.getElementById("board");
  board.innerHTML = "";
  if (!sfen) sfen = INITIAL_SFEN;
  const { grid, senteHand, goteHand } = parseSfen(sfen);
  for (let displayRow = 0; displayRow < 9; displayRow++) {
    const tr = document.createElement("tr");
    for (let displayCol = 0; displayCol < 9; displayCol++) {
      const td = document.createElement("td");
      const { file, rank } = cellIndexToFileRank(displayCol, displayRow);
      const sfenCol = 9 - file; const sfenRow = rank - 1;
      const cell = grid[sfenRow][sfenCol];
      if (cell) {
        const span = document.createElement("span");
        span.className = "piece-glyph";
        span.textContent = pieceKanji(cell);
        if ((cell.color === "gote" && !FLIPPED) || (cell.color === "sente" && FLIPPED)) span.style.transform = "rotate(180deg)";
        td.appendChild(span);
        if (cell.promoted) td.classList.add("promoted");
      }
      if (lastMove && lastMove.to && file === lastMove.to.x && rank === lastMove.to.y) td.classList.add("last-to");
      td.dataset.file = file; td.dataset.rank = rank;
      tr.appendChild(td);
    }
    board.appendChild(tr);
  }
  renderCoordinates();
  renderHand("hand-sente", senteHand, "sente");
  renderHand("hand-gote", goteHand, "gote");
  document.getElementById("hand-board-stack").classList.toggle("flipped", FLIPPED);
}

function renderMiniBoardInto(rootEl, sfen, lastMove, flipped = true) {

// ===== generic active-row scroll-into-window =====
// active を上から (priorVisible) 行目に固定する。
// offsetTop は offsetParent 相対なので、リストが positioned でないと壊れる。
// getBoundingClientRect 差分で確実に「リスト内」での相対位置を出す。
function scrollActiveInList(listEl, rowSelector = ".move-row", priorVisible = 3) {
  if (!listEl) return;
  const active = listEl.querySelector(rowSelector + ".active");
  if (!active) { listEl.scrollTop = 0; return; }
  const rows = Array.from(listEl.querySelectorAll(rowSelector));
  const idx = rows.indexOf(active);
  if (idx < 0) return;
  const topIdx = Math.max(0, idx - priorVisible);
  const topRow = rows[topIdx];
  const listRect = listEl.getBoundingClientRect();
  const rowRect = topRow.getBoundingClientRect();
  // 現在の scrollTop に「row 上端 - list 上端」の差分を加える = topRow がリストの最上部に来る scrollTop
  const target = listEl.scrollTop + (rowRect.top - listRect.top);
  const max = listEl.scrollHeight - listEl.clientHeight;
  listEl.scrollTop = Math.max(0, Math.min(max, target));
}

function populateGamePicker() {
  const sel = document.getElementById("game-picker");
  if (!sel || !initialData.practical_games) return;
  sel.innerHTML = "";
  const keys = Object.keys(initialData.practical_games);
  for (const k of keys) {

    opt.value = k;
    opt.textContent = initialData.practical_games[k].label || k;
    sel.appendChild(opt);

function switchGame(key) {
  if (!initialData.practical_games || !initialData.practical_games[key]) return;
  const root = document.getElementById("practical-games-root");
  if (!root) return;
  // 既存ゲームブロックを破棄
  root.querySelectorAll(".game-block").forEach(el => el.remove());
  if (gameResizeObserver) {
    gameResizeObserver.disconnect();
    gameResizeObserver = null;
  }
  // 新ゲーム構築
  currentGameKey = key;
  buildPracticalGame(key);
  gameCurrentPly[key] = 0;
  applyBlocks();              // 新キーの comment / meta を反映
  if (document.body.classList.contains("edit-mode")) {
    // 編集モード中は新ノードに contenteditable / input ハンドラを再付与
    root.querySelectorAll("[data-editable-key]").forEach(el => {
      el.setAttribute("contenteditable", "true");
      el.addEventListener("input", markDirty);
    });
  }
  renderGameBoardEl(key);
  syncGameListHeight(key);
  // ResizeObserver を新 wrap に貼り直し
  if ("ResizeObserver" in window) {
    const wrap = document.querySelector(`[data-game-key="${key}"] .game-board-wrap`);
    if (wrap) {
      gameResizeObserver = new ResizeObserver(() => syncGameListHeight(key));
      gameResizeObserver.observe(wrap);
    }
  }

  const sel = document.getElementById("game-picker");
  if (sel && sel.value !== key) sel.value = key;
}

// ===== edit mode + persistence =====
const STORAGE_KEY = "yababouze:4go_haya_kihon:standalone:v1";
let initialData = INITIAL_DATA;
let currentBlocks = null;
let dirty = false;
const $ = (sel) => document.querySelector(sel);

function loadOverrides() {
  try { const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : null; }
  catch(e) { return null; }
}
function mergeBlocks() {
  const overrides = loadOverrides() || {};
  currentBlocks = { ...initialData.blocks, ...overrides };
}
function sanitize(html) {
  const tmp = document.createElement("div"); tmp.innerHTML = html;
  tmp.querySelectorAll("script, style, iframe, object, embed").forEach(el => el.remove());
  tmp.querySelectorAll("*").forEach(el => {
    [...el.attributes].forEach(attr => {
      const name = attr.name.toLowerCase();
      const val = attr.value.trim().toLowerCase();
      if (name.startsWith("on")) el.removeAttribute(attr.name);
      else if ((name === "href" || name === "src") && val.startsWith("javascript:")) el.removeAttribute(attr.name);
    });
  });
  return tmp.innerHTML;
}
function applyBlocks() {
  document.querySelectorAll("[data-editable-key]").forEach(el => {
    const key = el.dataset.editableKey;
    if (Object.prototype.hasOwnProperty.call(currentBlocks, key)) {
      el.innerHTML = sanitize(currentBlocks[key]);
    }
  });
}
function setEditMode(on) {
  document.body.classList.toggle("edit-mode", on);
  document.querySelectorAll("[data-editable-key]").forEach(el => {
    if (on) { el.setAttribute("contenteditable", "true"); el.addEventListener("input", markDirty); }
    else { el.removeAttribute("contenteditable"); el.removeEventListener("input", markDirty); }
  });
  $("#btn-save").disabled = !on || !dirty;
}
function markDirty() {
  dirty = true; $("#btn-save").disabled = false;
  setStatus("未保存の変更あり", "#fdb6b6");
}
function setStatus(msg, color) {
  const el = $("#status-msg");
  el.textContent = msg || "";
  el.style.color = color || "#22e2ff";
}
function collectCurrentHtml() {
  const out = {};
  document.querySelectorAll("[data-editable-key]").forEach(el => {
    out[el.dataset.editableKey] = sanitize(el.innerHTML.trim());
  });
  return out;
}
function save() {
  const blocks = collectCurrentHtml();
  const overrides = {};
  for (const [k, v] of Object.entries(blocks)) {
    if ((initialData.blocks[k] || "") !== v) overrides[k] = v;
  }
  if (Object.keys(overrides).length === 0) localStorage.removeItem(STORAGE_KEY);
  else localStorage.setItem(STORAGE_KEY, JSON.stringify(overrides));
  currentBlocks = blocks;
  dirty = false;
  $("#btn-save").disabled = true;
  setStatus("保存しました", "#a8e6a3");
  setTimeout(() => setStatus(""), 2000);
}
function reset() {
  if (!confirm("初期ドラフトに戻します。現在の編集内容は失われます。よろしいですか？")) return;
  localStorage.removeItem(STORAGE_KEY);
  mergeBlocks(); applyBlocks();
  dirty = false;
  $("#btn-save").disabled = !$("#edit-toggle").checked;
  setStatus("リセットしました", "#a8e6a3");
  setTimeout(() => setStatus(""), 2000);
}
function exportJson() {
  const blocks = collectCurrentHtml();
  const payload = { version: 1, exported_at: new Date().toISOString(), blocks };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  const stamp = new Date().toISOString().slice(0, 10).replace(/-/g, "");
  a.download = `4go_haya_kihon_${stamp}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  setStatus("エクスポート完了", "#a8e6a3");
  setTimeout(() => setStatus(""), 2000);
}
function importJson(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      const blocks = data.blocks || data;
      if (typeof blocks !== "object") throw new Error("invalid format");
      const overrides = {};
      for (const [k, v] of Object.entries(blocks)) {
        if ((initialData.blocks[k] || "") !== v) overrides[k] = v;
      }
      if (Object.keys(overrides).length === 0) localStorage.removeItem(STORAGE_KEY);
      else localStorage.setItem(STORAGE_KEY, JSON.stringify(overrides));
      mergeBlocks(); applyBlocks();
      dirty = false;
      $("#btn-save").disabled = !$("#edit-toggle").checked;
      setStatus("インポート完了", "#a8e6a3");
      setTimeout(() => setStatus(""), 2000);
    } catch (err) { alert("インポート失敗：" + err.message); }
  };
  reader.readAsText(file);
}

// ===== boot =====
function main() {
  mergeBlocks();
  setFlipped(true);
  renderBoard(initialData.basic_sfen, initialData.basic_last_move);
  renderMainLine();
  renderVariations();
  renderPracticalGames();
  applyBlocks();
  renderMainlineBoardEl();
  syncMainlineListHeight();
  syncAllVarListHeights();
  syncAllGameListHeights();
  const wrapEl = document.querySelector(".mainline-board-wrap");
  if (wrapEl && "ResizeObserver" in window) {
    new ResizeObserver(syncMainlineListHeight).observe(wrapEl);
  }
  if ("ResizeObserver" in window) {
    document.querySelectorAll(".var-board-wrap").forEach(w => {
      new ResizeObserver(syncAllVarListHeights).observe(w);
    });
    // .game-board-wrap の ResizeObserver は switchGame() 内で都度貼り直す
  }
  window.addEventListener("resize", () => {
    syncMainlineListHeight();
    syncAllVarListHeights();
    syncAllGameListHeights();
  });
  $("#edit-toggle").addEventListener("change", (e) => setEditMode(e.target.checked));
  $("#btn-save").addEventListener("click", save);
  $("#btn-reset").addEventListener("click", reset);
  $("#btn-export").addEventListener("click", exportJson);
  $("#btn-import").addEventListener("change", (e) => {
    const f = e.target.files[0];
    if (f) importJson(f);
    e.target.value = "";
  });
  document.querySelectorAll(".mainline-controls button[data-ml-action]").forEach(btn => {
    btn.addEventListener("click", () => {
      const a = btn.dataset.mlAction;
      const steps = initialData.main_line.steps;
      if (a === "start") setMainlinePly(0);
      else if (a === "prev") setMainlinePly(currentPly - 1);
      else if (a === "next") setMainlinePly(currentPly + 1);
      else if (a === "end") setMainlinePly(steps.length - 1);
    });
  });
  window.addEventListener("keydown", (e) => {
    if (document.body.classList.contains("edit-mode")) return;
    const tag = (e.target && e.target.tagName) || "";
    if (e.target && e.target.isContentEditable) return;
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.key === "ArrowRight") { setMainlinePly(currentPly + 1); e.preventDefault(); }
    else if (e.key === "ArrowLeft") { setMainlinePly(currentPly - 1); e.preventDefault(); }
    else if (e.key === "Home") { setMainlinePly(0); e.preventDefault(); }
    else if (e.key === "End") { setMainlinePly(initialData.main_line.steps.length - 1); e.preventDefault(); }
  });
  window.addEventListener("beforeunload", (e) => {
    if (dirty) { e.preventDefault(); e.returnValue = ""; }
  });
}
main();
</script>
