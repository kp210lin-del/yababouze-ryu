<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>寄せの手筋200</title>
<style>
:root{
  --bg:#f6f1e7; --paper:#fffdf8; --ink:#2b2620; --ink-dim:#857c6c;
  --line:#d8cdb6; --wood:#f3dca0; --wood-2:#e9ce88;
  --sente:#1c160f; --gote:#1c160f;
  --accent:#c2451f; --ok:#2e7d4f; --ng:#c0392b;
  --hl:#ffd34d; --last:#ffe39b;
  --shadow:0 6px 20px -10px rgba(60,45,20,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  background:var(--bg); color:var(--ink);
  -webkit-user-select:none; user-select:none;
  touch-action:manipulation;
  display:flex; flex-direction:column; align-items:center;
  min-height:100vh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
#app{ width:100%; max-width:660px; display:flex; flex-direction:column; }

/* ---- header ---- */
header{
  display:flex; align-items:center; justify-content:space-between; gap:8px 10px;
  flex-wrap:wrap;
  padding:10px 14px 8px;
}
header .hl, header .hr{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
header .title{ font-size:19px; font-weight:800; letter-spacing:.04em; color:var(--ink); white-space:nowrap; }
header .counter{ font-size:16px; font-weight:700; color:var(--ink-dim); font-variant-numeric:tabular-nums; white-space:nowrap; }
/* テーマはタイトルと同じ行に小さめのピルで表示 */
.theme{ display:inline-block; font-size:13px; font-weight:800; color:var(--accent);
  letter-spacing:.02em; background:var(--paper); border:1px solid var(--line); border-radius:999px; padding:3px 10px; }
.theme .ch{ color:var(--ink-dim); font-weight:700; margin-right:5px; }
.chip{
  font-family:inherit; font-size:14px; font-weight:800; white-space:nowrap;
  padding:7px 13px; border-radius:999px; cursor:pointer; min-height:38px;
  border:1px solid var(--line); background:var(--paper); color:var(--ink);
}
.chip:active{ transform:translateY(1px); }
#b-hint{ border-color:var(--accent); color:var(--accent); }

/* ---- hand strips (固定高・横スクロール) ---- */
.hand{
  display:flex; align-items:center; gap:10px;
  height:62px; min-height:62px;
  margin:0 12px; padding:0 4px;
  overflow-x:auto; overflow-y:hidden; white-space:nowrap;
  scrollbar-width:none;
}
.hand::-webkit-scrollbar{ display:none; }
.hand .lbl{ flex:0 0 auto; font-size:16px; font-weight:800; color:var(--ink-dim); }
.hand .pieces{ display:flex; gap:9px; align-items:center; }
.hp{
  flex:0 0 auto; display:inline-flex; align-items:center; gap:2px;
  font-size:30px; font-weight:800; line-height:1;
  padding:8px 14px; min-height:51px; border-radius:11px;
  background:var(--paper); border:1px solid var(--line); color:var(--ink);
}
.hp .cnt{ font-size:18px; font-weight:800; color:var(--ink-dim); }
.hp.selectable{ cursor:pointer; }
.hp.sel{ background:var(--hl); border-color:var(--accent); box-shadow:0 0 0 2px var(--accent) inset; }
.hand .empty{ font-size:12px; color:var(--ink-dim); }

/* ---- board (大・正方形・固定) ---- */
#board-wrap{ padding:6px 14px; position:relative; }
#hint-pop{
  position:absolute; left:50%; bottom:24%; transform:translateX(-50%) translateY(8px);
  background:rgba(28,22,15,.86); color:#fff; font-size:15px; font-weight:800;
  padding:9px 16px; border-radius:999px; white-space:nowrap; pointer-events:none;
  opacity:0; transition:opacity .25s ease, transform .25s ease; z-index:5;
  box-shadow:0 8px 24px rgba(0,0,0,.35);
}
#hint-pop.show{ opacity:1; transform:translateX(-50%) translateY(0); }
/* 状況メッセージ（詰ましてください等）を盤の下部にオーバーレイ表示 */
#board-msg{
  position:absolute; left:50%; bottom:8px; transform:translateX(-50%);
  max-width:92%; text-align:center; white-space:nowrap;
  background:rgba(255,253,248,.92); border:1px solid var(--line); border-radius:10px;
  padding:6px 14px; font-size:17px; font-weight:800; color:var(--ink);
  box-shadow:0 4px 14px rgba(60,45,20,.28); pointer-events:none;
  opacity:0; transition:opacity .2s ease; z-index:6;
}
#board-msg.show{ opacity:1; }
#board-msg.ok{ color:var(--ok); border-color:var(--ok); }
#board-msg.ng{ color:var(--ng); border-color:var(--ng); }
#board-msg.tip{ color:var(--ink-dim); font-weight:700; }
#board{
  width:100%; aspect-ratio:1/1;
  display:grid; grid-template-columns:repeat(9,1fr); grid-template-rows:repeat(9,1fr);
  background:linear-gradient(180deg,var(--wood),var(--wood-2));
  border:2px solid #6b4f2b; border-radius:6px;
  box-shadow:var(--shadow); overflow:hidden;
}
.cell{
  position:relative; display:flex; align-items:center; justify-content:center;
  border:.5px solid rgba(80,55,20,.32);
  font-size:clamp(22px,7.8vw,46px); font-weight:800; line-height:1;
  color:var(--sente);
}
.cell .g{ display:block; }
.cell.gote .g{ transform:rotate(180deg); color:var(--gote); }
.cell.promoted{ color:#b03a1a; }
.cell.sel{ background:var(--hl); }
.cell.last{ background:var(--last); }
.cell.hint{ box-shadow:0 0 0 3px var(--accent) inset; animation:pulse 1s ease-in-out infinite; }
.cell.movable::after{
  content:""; position:absolute; width:26%; height:26%; border-radius:50%;
  background:rgba(194,69,31,.28);
}
@keyframes pulse{ 0%,100%{box-shadow:0 0 0 3px rgba(194,69,31,.9) inset;} 50%{box-shadow:0 0 0 3px rgba(194,69,31,.3) inset;} }

/* ---- feedback (固定高) ---- */
#feedback{
  margin:6px 14px 2px; min-height:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
  text-align:center;
}
#fb-msg{ font-size:19px; font-weight:800; min-height:24px; }
#fb-msg.ok{ color:var(--ok); }
#fb-msg.ng{ color:var(--ng); }
#fb-msg.tip{ color:var(--ink-dim); font-weight:700; font-size:14px; }
#ans-btn{
  display:none; font-family:inherit; font-size:16px; font-weight:800;
  padding:10px 20px; border-radius:999px; cursor:pointer;
  border:1.5px solid var(--accent); color:var(--accent); background:var(--paper);
}
#ans-btn.show{ display:inline-block; }
.fb-actions{ display:flex; gap:10px; align-items:center; justify-content:center; }
#undo-btn{
  display:none; font-family:inherit; font-size:16px; font-weight:800;
  padding:10px 20px; border-radius:999px; cursor:pointer;
  border:1.5px solid var(--ink-dim); color:var(--ink-dim); background:var(--paper);
}
#undo-btn.show{ display:inline-block; }
#undo-btn:active{ transform:translateY(1px); }

/* ---- controls (下部集約) ---- */
#controls{ margin:8px 14px 24px; display:flex; flex-direction:column; gap:10px; }
.row{ display:flex; gap:10px; }
.btn{
  flex:1; font-family:inherit; font-size:16px; font-weight:800;
  padding:15px 6px; border-radius:13px; cursor:pointer;
  border:1px solid var(--line); background:var(--paper); color:var(--ink);
  min-height:53px;
}
.btn:active{ transform:translateY(1px); }
.btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
.btn.sub{ background:transparent; color:var(--ink-dim); font-weight:700; font-size:14px; }
#b-edit.active{ background:var(--accent); border-color:var(--accent); color:#fff; }

/* ---- overlays ---- */
.overlay{
  position:fixed; inset:0; z-index:50; display:none;
  align-items:center; justify-content:center;
  background:rgba(20,15,8,.78); padding:16px;
}
.overlay.show{ display:flex; }
#ans-overlay img{ max-width:100%; max-height:90vh; border-radius:8px; box-shadow:0 10px 40px rgba(0,0,0,.5); background:#fff; }
#ans-overlay .close{
  position:absolute; top:calc(env(safe-area-inset-top) + 12px); right:16px;
  font-size:30px; color:#fff; font-weight:800; cursor:pointer; line-height:1;
}

/* promotion modal */
#promo .card{ background:var(--paper); border-radius:16px; padding:22px; text-align:center; box-shadow:0 16px 50px rgba(0,0,0,.4); }
#promo .card p{ margin:0 0 16px; font-weight:800; font-size:16px; }
#promo .card .opts{ display:flex; gap:12px; }
#promo .card .opt{ font-size:30px; font-weight:800; padding:14px 26px; border-radius:12px; border:2px solid var(--line); background:#fff; cursor:pointer; }
#promo .card .opt:active{ border-color:var(--accent); }

/* success burst */
#burst{
  position:fixed; inset:0; z-index:60; display:none;
  align-items:center; justify-content:center; pointer-events:none;
}
#burst.show{ display:flex; }
#burst .label{
  font-size:64px; font-weight:900; color:var(--ok);
  text-shadow:0 4px 0 #fff, 0 8px 24px rgba(46,125,79,.5);
  transform:scale(.4); opacity:0;
  animation:pop .65s cubic-bezier(.2,1.4,.4,1) forwards;
}
@keyframes pop{ 0%{transform:scale(.4);opacity:0;} 55%{transform:scale(1.12);opacity:1;} 100%{transform:scale(1);opacity:1;} }
#board.win{ animation:glow 1.1s ease-out; }
@keyframes glow{ 0%{box-shadow:0 0 0 0 rgba(46,125,79,.0);} 30%{box-shadow:0 0 0 6px rgba(46,125,79,.55),0 0 40px rgba(46,125,79,.6);} 100%{box-shadow:var(--shadow);} }

/* jump modal */
#jump .card{ background:var(--paper); border-radius:16px; padding:20px; width:min(92vw,340px); text-align:center; }
#jump .card p{ margin:0 0 12px; font-weight:800; }
#jump input{ font-size:20px; padding:10px; width:120px; text-align:center; border:1px solid var(--line); border-radius:10px; font-family:inherit; }
#jump .card .go{ display:block; width:100%; margin-top:14px; }

.badge{ display:inline-block; font-size:12px; font-weight:800; color:#fff; background:var(--ink-dim); padding:3px 10px; border-radius:999px; }
.lvb{ font-size:13px; font-weight:800; color:#fff; padding:3px 10px; border-radius:999px; white-space:nowrap; }
.lvb.l1{ background:var(--ok); } .lvb.l2{ background:#d8932b; } .lvb.l3{ background:var(--ng); }
.filter{ display:flex; align-items:center; justify-content:center; gap:8px; font-size:15px; font-weight:700; color:var(--ink-dim); cursor:pointer; padding:6px; min-height:44px; }
.filter input{ width:20px; height:20px; accent-color:var(--accent); }
.filter select{ font-family:inherit; font-size:15px; font-weight:700; color:var(--ink); background:var(--paper);
  border:1px solid var(--line); border-radius:10px; padding:8px 12px; min-height:40px; cursor:pointer; }
.lvchk{ display:inline-flex; align-items:center; gap:4px; color:var(--ink); cursor:pointer;
  border:1px solid var(--line); border-radius:10px; padding:6px 10px; min-height:40px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hl"><span class="title">寄せの手筋200</span><span class="theme" id="theme" style="display:none"></span></div>
    <div class="hr"><span id="lv-badge" class="lvb" style="display:none"></span><button class="chip" id="b-jump"># 問題へ</button><span class="counter"><span id="cur">1</span> / <span id="total">200</span></span></div>
  </header>

  <div class="hand" id="hand-gote"><span class="lbl">△ 相手</span><div class="pieces"></div></div>
  <div id="board-wrap"><div id="board"></div><div id="hint-pop"></div><div id="board-msg"></div></div>
  <div class="hand" id="hand-sente"><span class="lbl">▲ 自分</span><div class="pieces"></div></div>

  <div id="feedback">
    <div class="fb-actions">
      <button id="ans-btn">📖 解答ページ</button>
      <button id="undo-btn">↶ 一手戻す</button>
    </div>
  </div>

  <div id="controls">
    <div class="row">
      <button class="btn" id="b-prev">◀ 前</button>
      <button class="btn" id="b-reset">↺ もう一度</button>
      <button class="btn primary" id="b-next">次 ▶</button>
    </div>
    <div class="row">
      <button class="btn" id="b-hint">💡 ヒント</button>
      <button class="btn" id="b-edit">✏️ 自由編集モード</button>
    </div>
    <span class="filter">出題:&nbsp;
      <label class="lvchk"><input type="checkbox" class="lv-cb" value="1" checked> Lv1</label>
      <label class="lvchk"><input type="checkbox" class="lv-cb" value="2" checked> Lv2</label>
      <label class="lvchk"><input type="checkbox" class="lv-cb" value="3" checked> Lv3</label>
    </span>
  </div>
</div>

<div class="overlay" id="ans-overlay"><span class="close">×</span><img id="ans-img" alt="解答ページ"></div>
<div class="overlay" id="promo"><div class="card"><p>成りますか？</p><div class="opts"><button class="opt" id="promo-yes"></button><button class="opt" id="promo-no"></button></div></div></div>
<div class="overlay" id="jump"><div class="card"><p>問題番号 (1〜200)</p><input id="jump-input" type="number" min="1" max="200" inputmode="numeric"><button class="btn primary go" id="jump-go">移動</button></div></div>
<div id="burst"><div class="label">正解！</div></div>

/* ===== SFEN ===== */
const KANJI = {P:"歩",L:"香",N:"桂",S:"銀",G:"金",B:"角",R:"飛",K:"玉"};
const PROMO = {P:"と",L:"杏",N:"圭",S:"全",B:"馬",R:"龍"};
const HAND_ORDER = ["R","B","G","S","N","L","P"];

function parseSfen(sfen){
  const [boardStr, turn, handStr] = sfen.split(" ");
  const grid = [];
  for(const row of boardStr.split("/")){
    const r=[]; let i=0;
    while(i<row.length){
      const ch=row[i];
      if(/[1-9]/.test(ch)){ const n=+ch; for(let j=0;j<n;j++) r.push(null); i++; }
      else if(ch==="+"){ const nx=row[i+1]; r.push({letter:nx.toUpperCase(),color:nx===nx.toUpperCase()?"sente":"gote",promoted:true}); i+=2; }
      else { r.push({letter:ch.toUpperCase(),color:ch===ch.toUpperCase()?"sente":"gote",promoted:false}); i++; }
    }
    grid.push(r);
  }
  const senteHand={}, goteHand={};
  if(handStr && handStr!=="-"){
    let i=0;
    while(i<handStr.length){
      let num=""; while(/[0-9]/.test(handStr[i])){ num+=handStr[i]; i++; }
      const ch=handStr[i]; if(!ch) break; i++;
      const cnt=num?+num:1;
      const tgt = ch===ch.toUpperCase()?senteHand:goteHand;
      const k=ch.toUpperCase();
      tgt[k]=(tgt[k]||0)+cnt;
    }
  }
  return {grid, turn, senteHand, goteHand};
}
function cloneState(s){
  return {turn:s.turn, lastTo:s.lastTo?{...s.lastTo}:null,
    grid:s.grid.map(r=>r.map(c=>c?{...c}:null)),
    senteHand:{...s.senteHand}, goteHand:{...s.goteHand}};
}
// USI square "7f" -> {r,c}  (r:0=rank1 top, c:0=file9 left)
function sqRC(sq){ const file=+sq[0]; const rank=sq.charCodeAt(1)-96; return {r:rank-1, c:9-file}; }
function rcSq(r,c){ return `${9-c}${String.fromCharCode(97+r)}`; }

function applyMove(state, usi){
  const s=cloneState(state);
  const sente = s.turn==="b";
  if(usi.includes("*")){
    const p=usi[0]; const {r,c}=sqRC(usi.slice(2,4));
    s.grid[r][c]={letter:p,color:sente?"sente":"gote",promoted:false};
    const hand=sente?s.senteHand:s.goteHand; hand[p]=(hand[p]||0)-1;
    s.lastTo={r,c};
  } else {
    const a=sqRC(usi.slice(0,2)), b=sqRC(usi.slice(2,4));
    const promo=usi.endsWith("+");
    const mv=s.grid[a.r][a.c];
    const cap=s.grid[b.r][b.c];
    if(cap){ const hand=sente?s.senteHand:s.goteHand; hand[cap.letter]=(hand[cap.letter]||0)+1; }
    if(promo) mv.promoted=true;
    s.grid[b.r][b.c]=mv; s.grid[a.r][a.c]=null;
    s.lastTo=b;
  }
  s.turn = sente?"w":"b";
  return s;
}

let liveSeqs=[];      // sequences still matching (各要素に .hisshi: 必至点index|null)
let ply=0;            // moves played
let path=[];          // 初手からの実際の指し手列 (root-rooted wrong 照合用)
let solved=false;
let failed=false;     // 本の紛れを指して反証再生済み（リセットまで盤を固定）
let hisshiPassed=false; // 必至点を通過済み（以降は詰みフェーズ。先手は手動・後手のみ自動応手）
let flip=false;
let lvSet=new Set([1,2,3]);   // 表示する難易度の集合（Lv1/Lv2/Lv3 のチェックに対応）
let sel=null;         // {type:'board',r,c} | {type:'hand',letter,color}
let busy=false;       // during auto reply / animations
let analyze=false;    // 検討モード（正解後に自由に駒を動かせる）
let editMode=false;   // 自由編集モード（いつでも手動で自由に動かせる）
let analyzeHist=[];   // 検討/編集モードの局面履歴（一手戻す用）
function isFree(){ return analyze||editMode; }

const AUTO_REPLY_DELAY_MS = 250;
const REFUTATION_STEP_DELAY_MS = 420;
const PRELOAD_LOOKAHEAD = 2;

const $=s=>document.querySelector(s);
const boardEl=$("#board");

function loadProblem(i){
  idx=(i+PROBLEMS.length)%PROBLEMS.length;
  prob=PROBLEMS[idx];
  state=parseSfen(prob.full_sfen);
  // liveSeqs: answer_sequences のコピー。各配列に .hisshi (必至点 index|null) を付与。
  const hi=prob.hisshi_index||[];
  liveSeqs=(prob.answer_sequences||[]).map((s,i)=>{
    const a=s.slice(); a.hisshi=(hi[i]!=null)?hi[i]:null; return a;
  }).filter(a=>a.length);
  ply=0; path=[]; solved=false; failed=false; hisshiPassed=false; sel=null; busy=false; analyze=false; editMode=false; analyzeHist=[];
  $("#undo-btn").classList.remove("show");
  $("#b-edit").classList.remove("active");
  $("#cur").textContent=prob.no;
  const lb=$("#lv-badge");
  if(prob.level){ lb.style.display="inline-block"; lb.className="lvb l"+prob.level; lb.textContent="Lv"+prob.level; }
  else { lb.style.display="none"; }
  const th=$("#theme");
  if(prob.theme){ th.style.display="inline-block"; th.innerHTML = (prob.chapter? '<span class="ch">第'+prob.chapter+'章</span>':'') + prob.theme; }
  else { th.style.display="none"; }
  setMsg(liveSeqs.length? "▲を持って指してください" : "（この問題は解答準備中）","tip");
  $("#ans-btn").classList.remove("show");
  preloadAnswerImages(idx);
  render();
}

function preloadAnswerImages(startIdx){
  for(let k=0;k<=PRELOAD_LOOKAHEAD;k++){
    const p=PROBLEMS[(startIdx+k)%PROBLEMS.length];
    if(p && p.answer_img){
      const img=new Image();
      img.decoding="async";
      img.src=p.answer_img;
    }
  }
}

function setMsg(t,cls){
  const m=$("#board-msg");
  if(!t){ m.className=""; m.textContent=""; return; }
  m.textContent=t;
  m.className=(cls?cls+" ":"")+"show";
}

function render(){
  // board
  boardEl.innerHTML="";
  boardEl.classList.remove("win");
  const movable = sel && getMovableTargets();
  for(let dr=0; dr<9; dr++){
    for(let dc=0; dc<9; dc++){
      const r = flip?8-dr:dr;
      const c = flip?8-dc:dc;
      const cell=document.createElement("div");
      cell.className="cell";
      const pc=state.grid[r][c];
      if(pc){
        cell.classList.add(pc.color);
        if(pc.promoted) cell.classList.add("promoted");
        const g=document.createElement("span"); g.className="g";
        g.textContent = pc.promoted ? (PROMO[pc.letter]||KANJI[pc.letter]) : KANJI[pc.letter];
        cell.appendChild(g);
      }
      if(state.lastTo && state.lastTo.r===r && state.lastTo.c===c) cell.classList.add("last");
      if(sel && sel.type==="board" && sel.r===r && sel.c===c) cell.classList.add("sel");
      if(movable && movable.has(r+","+c)) cell.classList.add("movable");
      cell.addEventListener("click",()=>onCell(r,c));
      boardEl.appendChild(cell);
    }
  }
  renderHand("#hand-sente", state.senteHand, "sente");
  renderHand("#hand-gote", state.goteHand, "gote");
}

function renderHand(sel_, hand, color){
  const box=$(sel_).querySelector(".pieces");
  box.innerHTML="";
  const ks=HAND_ORDER.filter(k=>(hand[k]||0)>0);
  if(!ks.length){ const e=document.createElement("span"); e.className="empty"; e.textContent="なし"; box.appendChild(e); return; }
  for(const k of ks){
    const n=hand[k];
    const el=document.createElement("span"); el.className="hp"; el.dataset.letter=k;
    el.innerHTML=`${KANJI[k]}`+(n>1?`<span class="cnt">${n}</span>`:"");
    // 通常モード: 先手の持駒のみ・自分の手番・未正解のとき選択可
    // 検討モード: 両者の持駒を自由に選択可
    const canSelect = isFree() ? !busy
      : (color==="sente" && !solved && !busy && liveSeqs.length);
    if(canSelect){
      el.classList.add("selectable");
      if(sel && sel.type==="hand" && sel.letter===k && (sel.color||"sente")===color) el.classList.add("sel");
      el.addEventListener("click",()=>onHand(k,color));
    }
    box.appendChild(el);
  }
}

function getMovableTargets(){
  // for visual dots: empty/enemy squares (no legality check) — keep light: only when board piece selected
  if(!sel) return null;
  return null; // we keep dots off to avoid implying full legality; selection highlight is enough
}

function expectedSenteMoves(){
  const set=new Set();
  for(const s of liveSeqs){ if(s.length>ply) set.add(s[ply]); }
  return set;
}

function onHand(letter,color){
  if(isFree()){ return onHandFree(letter,color||"sente"); }
  if(solved||busy||failed||!liveSeqs.length) return;
  if(state.turn!=="b") return;
  if((state.senteHand[letter]||0)<=0) return;
  sel = (sel && sel.type==="hand" && sel.letter===letter) ? null : {type:"hand",letter,color:"sente"};
  clearHint(); render();
}

function onCell(r,c){
  if(isFree()){ return onCellFree(r,c); }
  if(solved||busy||failed||!liveSeqs.length) return;
  const pc=state.grid[r][c];
  if(!sel){
    if(pc && pc.color==="sente"){ sel={type:"board",r,c}; clearHint(); render(); }
    return;
  }
  if(sel.type==="board"){
    if(pc && pc.color==="sente"){ // reselect
      if(sel.r===r&&sel.c===c){ sel=null; } else { sel={type:"board",r,c}; }
      render(); return;
    }
    tryMoveBoard(sel.r,sel.c,r,c);
  } else { // hand drop
    if(pc){ render(); return; } // can't drop on occupied
    tryDrop(sel.letter,r,c);
  }
}

function tryDrop(letter,r,c){
  const usi=`${letter}*${rcSq(r,c)}`;
  attempt(usi);
}

function tryMoveBoard(ar,ac,br,bc){
  const base=`${rcSq(ar,ac)}${rcSq(br,bc)}`;
  const exp=expectedSenteMoves();
  const plain=exp.has(base), prom=exp.has(base+"+");
  if(plain && prom){ askPromo(base); return; }
  if(prom && !plain){ attempt(base+"+"); return; }
  // default: plain (also covers wrong moves)
  attempt(base);
}

function askPromo(base){
  const mv=state.grid[sqRC(base.slice(0,2)).r][sqRC(base.slice(0,2)).c];
  $("#promo-yes").textContent = PROMO[mv.letter]||"成";
  $("#promo-no").textContent = KANJI[mv.letter];
  const ov=$("#promo"); ov.classList.add("show");
  $("#promo-yes").onclick=()=>{ ov.classList.remove("show"); attempt(base+"+"); };
  $("#promo-no").onclick=()=>{ ov.classList.remove("show"); attempt(base); };
}

function attempt(usi){
  if(failed||busy) return;
  const exp=expectedSenteMoves();
  if(!exp.has(usi)){
    // 正解ではない → 本に載っている紛れ(root-rooted)か判定
    const w=findWrong(usi);
    if(w){ playRefutation(w); return; }
    sel=null;
    setMsg("✕ その手では正解になりません","ng");
    if(prob.answer_img) $("#ans-btn").classList.add("show");
    render();
    playError();
    return;
  }
  // 正解の先手手
  liveSeqs=liveSeqs.filter(s=>s[ply]===usi);
  state=applyMove(state,usi); path.push(usi); ply++;
  sel=null;
  $("#ans-btn").classList.remove("show");
  const cur=liveSeqs[0];
  const reachedHisshi=(cur.hisshi!=null && (ply-1)===cur.hisshi);
  const seqEnd=liveSeqs.some(s=>s.length===ply);

  // 手順完了
  if(seqEnd){
    solved=true; render();
    success(reachedHisshi ? "〇 正解！ 必至です 🎉"
            : hisshiPassed ? "詰み！ 完全制覇 ✨" : "〇 正解！");
    return;
  }
  // 必至到達（続きあり）: 盤上にバースト表示。以降は詰みフェーズ＝自分(先手)で指す・後手のみ自動応手
  if(reachedHisshi){
    hisshiPassed=true;
    setMsg("〇 正解！ これで必至です 🎉 詰ましてください","ok");
    render(); showBurst("必至！", false); playHisshi();
  } else {
    setMsg(hisshiPassed ? "詰ましてください" : "〇 正解！ 続けてください","ok");
    render(); playPlace();
  }
  // 後手の応手だけ自動再生 → 先手の手番をユーザーに返す（手番表示は出さない）
  const reply=cur[ply];
  busy=true;
  setTimeout(()=>{
    state=applyMove(state,reply); path.push(reply);
    liveSeqs=liveSeqs.filter(s=>s[ply]===reply); ply++;
    busy=false;
    setMsg(hisshiPassed ? "詰ましてください" : "続けてください","tip");
    render(); playOpp();
  }, AUTO_REPLY_DELAY_MS);
}

// root-rooted の紛れ照合。これまでの指し手列(path)を共有接頭辞として持ち、
// 次の手(index=ply)が usi に一致する wrong 手順を返す。初手紛れは ply=0(接頭辞空)。
function findWrong(usi){
  const ws=prob.wrong_sequences||[];
  const base=usi.replace(/\+$/,'');
  for(const w of ws){
    if(w.length<=ply) continue;
    let ok=true;
    for(let i=0;i<ply;i++){ if(w[i]!==path[i]){ ok=false; break; } }
    if(!ok) continue;
    if(String(w[ply]||'').replace(/\+$/,'')===base) return w;
  }
  return null;
}

// 紛れを指したとき: 誤手を盤に適用 → 本の反証手順(残り)を自動再生 → 盤を固定。
function playRefutation(w){
  sel=null;
  const wrongMove=w[ply];                 // 本表記どおりの誤手(成り含む)
  state=applyMove(state,wrongMove); path.push(wrongMove); ply++;
  render(); playError();
  if(prob.answer_img) $("#ans-btn").classList.add("show");
  if(ply>=w.length){
    // 反証手順が無い(初手紛れで後手応手未収録) → その場で打ち切り
    failed=true;
    setMsg("✕ その手は本の紛れです（これでは寄りません）。解答を確認しましょう。","ng");
    render(); return;
  }
  setMsg("✕ 本の紛れです。相手の応手を再生します…","ng");
  busy=true;
  (function step(){
    if(ply>=w.length){
      busy=false; failed=true;
      setMsg("✕ 本の手順どおり玉が逃げ、寄りません。解答を確認しましょう。","ng");
      render(); return;
    }
    const idx=ply, mv=w[idx];
    state=applyMove(state,mv); path.push(mv); ply++;
    render(); ((idx%2===0)?playPlace:playOpp)();
    setTimeout(step, REFUTATION_STEP_DELAY_MS);
  })();
}

// 盤の上に大きく一瞬表示するバースト（必至/詰み/正解で文言を出し分け）
function burstLabel(text){ return text.includes('必至')?'必至！':text.includes('詰み')?'詰み！':'正解！'; }
function showBurst(label, glow){
  const b=$("#burst");
  const lab=b.querySelector('.label'); if(lab) lab.textContent=label;
  b.classList.remove("show"); void b.offsetWidth; b.classList.add("show");
  setTimeout(()=>b.classList.remove("show"),1400);
  if(glow) boardEl.classList.add("win");
}
function success(text){
  setMsg(text,"ok");
  showBurst(burstLabel(text), true);
  playFanfare();
  // 正解後は検討モードへ：両者の駒を自由に動かせる
  setTimeout(enterAnalyze, 700);
}
function win(){ success("〇 正解！"); }   // 後方互換

/* ===== 検討モード（正解後に自由に駒を動かす） ===== */
function enterAnalyze(){
  analyze=true; sel=null; analyzeHist=[];
  if(prob.answer_img) $("#ans-btn").classList.add("show");
  $("#undo-btn").classList.remove("show");
  setMsg("🔎 検討モード：駒を自由に動かせます","tip");
  render();
}
function setEditMode(on){
  editMode=on;
  $("#b-edit").classList.toggle("active",on);
  if(on){
    sel=null; clearHint(); analyzeHist=[];
    $("#undo-btn").classList.add("show");
    if(prob.answer_img) $("#ans-btn").classList.add("show");
    setMsg("✏️ 自由編集モード：両者の駒・持駒を自由に動かせます","tip");
    render();
  } else {
    clearHint(); loadProblem(idx);   // 問題の初期局面へ戻す
  }
}
function pushHist(){ analyzeHist.push(cloneState(state)); if(analyzeHist.length>300) analyzeHist.shift(); }
function undoFree(){
  if(!analyzeHist.length) return;
  state=analyzeHist.pop(); sel=null;
  if(!analyzeHist.length) $("#undo-btn").classList.remove("show");
  render();
}
function onHandFree(letter,color){
  if(busy) return;
  const hand = color==="sente"?state.senteHand:state.goteHand;
  if((hand[letter]||0)<=0) return;
  sel = (sel && sel.type==="hand" && sel.letter===letter && (sel.color||"sente")===color)
        ? null : {type:"hand",letter,color};
  render();
}
function onCellFree(r,c){
  if(busy) return;
  const pc=state.grid[r][c];
  if(!sel){
    if(pc){ sel={type:"board",r,c}; render(); }
    return;
  }
  if(sel.type==="board"){
    const mv=state.grid[sel.r][sel.c];
    if(sel.r===r && sel.c===c){ sel=null; render(); return; }
    // 同じ向きの駒をクリックしたら選び直し
    if(pc && mv && pc.color===mv.color){ sel={type:"board",r,c}; render(); return; }
    freeMove(sel.r,sel.c,r,c);
  } else { // 持駒を打つ
    if(pc){ render(); return; }   // 駒のある所には打てない
    freeDrop(sel.letter, sel.color||"sente", r,c);
  }
}
function freeMove(ar,ac,br,bc){
  const mv=state.grid[ar][ac]; if(!mv) return;
  pushHist();
  const cap=state.grid[br][bc];
  if(cap){ // 取った駒は動かした側の持駒へ（成りは戻す）
    const hand = mv.color==="sente"?state.senteHand:state.goteHand;
    hand[cap.letter]=(hand[cap.letter]||0)+1;
  }
  state.grid[br][bc]=mv; state.grid[ar][ac]=null;
  state.lastTo={r:br,c:bc};
  sel=null;
  $("#undo-btn").classList.add("show");
  // 成り確認（敵陣の出入りで、成れる駒のみ）
  const promotable = !mv.promoted && "PLNSBR".includes(mv.letter);
  const inZone = mv.color==="sente" ? (br<=2 || ar<=2) : (br>=6 || ar>=6);
  if(promotable && inZone){
    $("#promo-yes").textContent = PROMO[mv.letter]||"成";
    $("#promo-no").textContent  = KANJI[mv.letter];
    const ov=$("#promo"); ov.classList.add("show");
    $("#promo-yes").onclick=()=>{ ov.classList.remove("show"); mv.promoted=true; render(); };
    $("#promo-no").onclick =()=>{ ov.classList.remove("show"); render(); };
  } else {
    render();
  }
}
function freeDrop(letter,color,r,c){
  const hand = color==="sente"?state.senteHand:state.goteHand;
  if((hand[letter]||0)<=0){ sel=null; render(); return; }
  pushHist();
  hand[letter]--;
  state.grid[r][c]={letter,color,promoted:false};
  state.lastTo={r,c};
  sel=null;
  $("#undo-btn").classList.add("show");
  render();
}

/* ===== hint ===== */
let hintCells=[];
let hintTimer=null;
function clearHint(){
  hintCells.forEach(c=>c&&c.classList.remove("hint")); hintCells=[];
  const pop=$("#hint-pop"); if(pop) pop.classList.remove("show");
  if(hintTimer){ clearTimeout(hintTimer); hintTimer=null; }
}
function showHint(){
  if(editMode||solved||busy||failed||!liveSeqs.length) return;
  const exp=[...expectedSenteMoves()]; if(!exp.length) return;
  const usi=liveSeqs[0][ply]||exp[0];
  clearHint(); render();
  const mark=(r,c)=>{ const dr=flip?8-r:r, dc=flip?8-c:c; const el=boardEl.children[dr*9+dc]; if(el){el.classList.add("hint"); hintCells.push(el);} };
  let label;
  if(usi.includes("*")){ const {r,c}=sqRC(usi.slice(2,4)); mark(r,c); label=`💡 ${KANJI[usi[0]]}を打つあたり`; }
  else { const a=sqRC(usi.slice(0,2)), b=sqRC(usi.slice(2,4)); mark(a.r,a.c); mark(b.r,b.c); label="💡 光る駒を動かします"; }
  const pop=$("#hint-pop"); pop.textContent=label; pop.classList.add("show");
  hintTimer=setTimeout(()=>{ pop.classList.remove("show"); hintCells.forEach(c=>c&&c.classList.remove("hint")); hintCells=[]; hintTimer=null; }, 5000);
}

/* ===== sounds (AudioContext) ===== */
let actx=null;
function ac(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
function beep(freq,start,dur,type,gain){
  const a=ac(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type||"sine"; o.frequency.value=freq;
  o.connect(g); g.connect(a.destination);
  const t=a.currentTime+start;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(gain||.18,t+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.start(t); o.stop(t+dur+.02);
}
function playPlace(){ beep(560,0,.10,"triangle",.14); }
function playOpp(){ beep(400,0,.11,"triangle",.13); }
function playError(){ beep(180,0,.18,"sawtooth",.12); beep(150,.10,.18,"sawtooth",.10); }
function playFanfare(){ const n=[523,659,784,1047]; n.forEach((f,i)=>beep(f,i*.10,.28,"triangle",.18)); beep(1319,.40,.5,"sine",.16); }
function playHisshi(){ beep(784,0,.12,"triangle",.16); beep(1047,.10,.16,"sine",.13); }  // 必至: 短く軽い2音

/* ===== answer page overlay ===== */
function openAns(){ if(!prob.answer_img) return; $("#ans-img").src=prob.answer_img; $("#ans-overlay").classList.add("show"); }
function closeAns(){ $("#ans-overlay").classList.remove("show"); }

/* ===== controls ===== */
function passesFilter(i){
  const lv=PROBLEMS[i].level;
  if(!lv) return true;            // 難易度未設定の問題は常に表示
  return lvSet.has(lv);
}
function stepIdx(dir){ let i=idx; for(let k=0;k<PROBLEMS.length;k++){ i=(i+dir+PROBLEMS.length)%PROBLEMS.length; if(passesFilter(i)) return i; } return idx; }
$("#b-prev").onclick=()=>{ clearHint(); loadProblem(stepIdx(-1)); };
$("#b-next").onclick=()=>{ clearHint(); loadProblem(stepIdx(1)); };
$("#b-reset").onclick=()=>{ clearHint(); loadProblem(idx); };
document.querySelectorAll(".lv-cb").forEach(cb=>{
  cb.onchange=()=>{
    lvSet=new Set([...document.querySelectorAll(".lv-cb:checked")].map(c=>+c.value));
    if(lvSet.size===0){ cb.checked=true; lvSet.add(+cb.value); return; }  // 全部OFFは禁止
    if(!passesFilter(idx)){ clearHint(); loadProblem(stepIdx(1)); }
  };
});
$("#undo-btn").onclick=undoFree;
$("#b-edit").onclick=()=>setEditMode(!editMode);
$("#b-hint").onclick=showHint;
$("#ans-btn").onclick=openAns;
$("#ans-overlay").onclick=closeAns;
$("#promo").onclick=(e)=>{ if(e.target.id==="promo") $("#promo").classList.remove("show"); };
$("#b-jump").onclick=()=>{ $("#jump-input").value=prob.no; $("#jump").classList.add("show"); $("#jump-input").focus(); };
$("#jump").onclick=(e)=>{ if(e.target.id==="jump") $("#jump").classList.remove("show"); };
$("#jump-go").onclick=()=>{ const v=+$("#jump-input").value; if(v>=1&&v<=PROBLEMS.length){ $("#jump").classList.remove("show"); clearHint(); loadProblem(v-1); } };
$("#jump-input").addEventListener("keydown",e=>{ if(e.key==="Enter") $("#jump-go").click(); });

$("#total").textContent=PROBLEMS.length;
loadProblem(0);
</script>
